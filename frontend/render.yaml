# Render Blueprint for the FRONTEND ONLY — deployed independently from
# backend/render.yaml (two separate Blueprints, two separate deploy
# lifecycles, per your call). In the Render dashboard: New + > Blueprint,
# point it at this repo, and set the Blueprint's YAML path to
# "frontend/render.yaml" (Render defaults to a root-level render.yaml —
# this repo intentionally has none, so this path must be set explicitly).
#
# rootDir below is still "frontend" even though this file already lives
# inside frontend/ — see backend/render.yaml's identical note for why
# (root-of-repo-relative paths, not relative to wherever this file sits).

services:
  - type: web
    name: call-centre-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    # staticPublishPath is relative to rootDir when rootDir is set (NOT
    # repo-root-relative in that case — confirmed the hard way: Render's
    # own generic docs say "relative to the repo root" with no mention of
    # the rootDir interaction, which led to setting this to "frontend/build"
    # once already; the actual build log then failed with "Publish
    # directory frontend/build does not exist!", i.e. Render was looking
    # for <rootDir>/frontend/build = frontend/frontend/build. CRA's own
    # build output ("The build folder is ready to be deployed") confirmed
    # the build itself succeeded — only the publish path was wrong. Real
    # deploy behavior here overrides the docs wording.
    staticPublishPath: build
    envVars:
      # CRA bakes REACT_APP_* vars into the build at BUILD time, not read
      # at runtime — see src/api/apiConfig.js. The backend's real deployed
      # URL (from backend/render.yaml, a separate Blueprint). Changing
      # this means triggering a fresh build — env var changes alone don't
      # retroactively affect an already-built static bundle.
      - key: REACT_APP_API_URL
        value: https://call-centre-report-suite-backend.onrender.com
    routes:
      # React Router does client-side routing — without this rewrite,
      # refreshing (or deep-linking) any route other than "/" (e.g.
      # /campaigns/3/upload) 404s, since there's no actual file at that
      # path in the static build; every path needs to resolve to
      # index.html and let the React app's own router take over from there.
      - type: rewrite
        source: /*
        destination: /index.html
